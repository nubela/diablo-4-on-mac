name: Build

on:
  push:
    branches: [master]
  pull_request:
  # Publishing a release on GitHub (any tag name) builds it and attaches D4Mac.dmg / .zip.
  release:
    types: [published]
  # Manual run. Fill in a release tag to build that tag and attach the files to its release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach D4Mac.dmg/.zip to (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build app
        run: |
          # Tags like v1.2.3 or 1.2.3 set the app version; other tag names keep the default.
          if [[ "$RELEASE_TAG" =~ ^v?([0-9]+(\.[0-9]+)*)$ ]]; then export VERSION="${BASH_REMATCH[1]}"; fi
          scripts/build-app.sh
          scripts/make-dmg.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: D4Mac
          path: |
            dist/D4Mac.dmg
            dist/D4Mac.zip

      # The README links to releases/latest/download/D4Mac.dmg, which always points at
      # the newest release's file.
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/D4Mac.dmg
            dist/D4Mac.zip
