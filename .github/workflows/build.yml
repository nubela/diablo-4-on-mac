name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build app
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build-app.sh
          scripts/make-dmg.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: D4Mac
          path: |
            dist/D4Mac.dmg
            dist/D4Mac.zip

      # A tag like v0.1.0 publishes a GitHub Release. The README links to
      # releases/latest/download/D4Mac.dmg, which always points at the newest one.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/D4Mac.dmg
            dist/D4Mac.zip
          generate_release_notes: true
